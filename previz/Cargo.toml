[package]
name = "light-previz"
version = "0.1.0"
edition = "2021"
description = "LIGHT native previz — a Bevy window speaking the engine's WebSocket protocol"

[dependencies]
# No 2D, no UI, no audio: this window is a 3D viewport and a WebSocket client.
# Bevy's defaults pull bevy_sprite, bevy_ui, bevy_ui_render, bevy_ui_widgets,
# bevy_feathers and bevy_audio, none of which are ever used here, and a release
# build of this crate is minutes rather than seconds.
bevy = { version = "0.19", default-features = false, features = [
    "3d",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "std",
    "x11",
    "tonemapping_luts",
    # RectLight is a no-op without this — it needs the area-light LUTs, and
    # the failure is silent: the component spawns, the light exists, nothing
    # is illuminated. Panels and blinders are RectLights, so this is load
    # bearing rather than optional.
    "area_light_luts",
    "ktx2",
    "zstd_rust",
] }
tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
light-core = { path = "../core" }

[[bin]]
name = "light-previz"
path = "src/main.rs"
