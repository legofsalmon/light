[package]
name = "light-previz"
version = "0.1.0"
edition = "2021"
description = "LIGHT native previz — a Bevy window speaking the engine's WebSocket protocol"

[dependencies]
bevy = "0.16"
tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
light-core = { path = "../core" }

[[bin]]
name = "light-previz"
path = "src/main.rs"
