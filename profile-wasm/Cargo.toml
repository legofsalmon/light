[package]
name = "light-profile-wasm"
version = "0.1.0"
edition = "2021"
description = "LIGHT's compiled-profile interpreter + GDTF parser for the Node engine — one Rust implementation everywhere"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# float_roundtrip: match V8's correctly-rounded float parsing, same reason as
# core/Cargo.toml — this crate parses CompiledProfile JSON re-stringified by V8.
serde_json = { version = "1", features = ["float_roundtrip"] }
light-core = { path = "../core", default-features = false }
