[package]
name = "light-profile-wasm"
version = "0.1.0"
edition = "2021"
description = "LIGHT's compiled-profile interpreter + GDTF parser for the Node engine — one Rust implementation everywhere"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
light-core = { path = "../core", default-features = false }
