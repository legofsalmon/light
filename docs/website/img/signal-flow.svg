<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #141415; }
    .box { fill: #1c1c1e; stroke: #3c3c44; }
    .accent { fill: #212124; stroke: #39c2ff; }
    .hot { fill: #212124; stroke: #ff4d4d; }
    .t { fill: #d2d2d8; font-size: 13px; }
    .s { fill: #8c8c96; font-size: 10.5px; }
    .k { fill: #5c5c66; font-size: 9.5px; letter-spacing: .09em; }
    .arrow { stroke: #4a4a58; stroke-width: 1.4; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a4a58"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="380"/>

  <text class="k" x="24" y="28">HOW ONE FRAME IS BUILT — 40 TIMES A SECOND</text>

  <rect class="box" x="24" y="52" width="170" height="86" rx="4"/>
  <text class="t" x="38" y="76">Look</text>
  <text class="s" x="38" y="96">parts → a fixture group,</text>
  <text class="s" x="38" y="112">colour, dimmer, position,</text>
  <text class="s" x="38" y="128">beam, effects</text>

  <path class="arrow" d="M194 95 L236 95"/>

  <rect class="accent" x="236" y="52" width="176" height="86" rx="4"/>
  <text class="t" x="250" y="76">Resolution order</text>
  <text class="s" x="250" y="96">stored value</text>
  <text class="s" x="250" y="112">→ soft (ride / control)</text>
  <text class="s" x="250" y="128">→ modulator offset</text>

  <path class="arrow" d="M412 95 L454 95"/>

  <rect class="box" x="454" y="52" width="166" height="86" rx="4"/>
  <text class="t" x="468" y="76">Effects</text>
  <text class="s" x="468" y="96">wave over one parameter,</text>
  <text class="s" x="468" y="112">phase fanned across the</text>
  <text class="s" x="468" y="128">group by the fan basis</text>

  <path class="arrow" d="M620 95 L662 95"/>

  <rect class="box" x="662" y="52" width="166" height="86" rx="4"/>
  <text class="t" x="676" y="76">Layer merge</text>
  <text class="s" x="676" y="96">bottom to top, each with</text>
  <text class="s" x="676" y="112">a master and a blend:</text>
  <text class="s" x="676" y="128">normal / multiply / htp</text>

  <path class="arrow" d="M745 138 L745 176"/>

  <rect class="box" x="662" y="176" width="166" height="72" rx="4"/>
  <text class="t" x="676" y="200">Masters</text>
  <text class="s" x="676" y="220">grand master scales</text>
  <text class="s" x="676" y="236">intensity; speed scales rates</text>

  <path class="arrow" d="M662 212 L512 212"/>

  <rect class="hot" x="336" y="176" width="176" height="72" rx="4"/>
  <text class="t" x="350" y="200">Blackout</text>
  <text class="s" x="350" y="220">zeroes intensity and strobe.</text>
  <text class="s" x="350" y="236">Always wins.</text>

  <path class="arrow" d="M336 212 L206 212"/>

  <rect class="box" x="24" y="176" width="182" height="72" rx="4"/>
  <text class="t" x="38" y="200">Profile render</text>
  <text class="s" x="38" y="220">each fixture's channels,</text>
  <text class="s" x="38" y="236">from its GDTF definition</text>

  <path class="arrow" d="M115 248 L115 286"/>

  <rect class="box" x="24" y="286" width="182" height="66" rx="4"/>
  <text class="t" x="38" y="310">DMX universes</text>
  <text class="s" x="38" y="330">Art-Net / sACN, or nothing</text>
  <text class="s" x="38" y="346">at all until you enable them</text>

  <rect class="box" x="256" y="286" width="572" height="66" rx="4"/>
  <text class="t" x="272" y="310">The beat clock drives everything time-based</text>
  <text class="s" x="272" y="332">Tap it, drag the BPM, take it from Resolume over OSC, or join an Ableton Link session. Effect rates are in beats, so the rig stays in time when the tempo moves.</text>
</svg>
