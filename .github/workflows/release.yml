name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: build LIGHT.app (macOS)
    runs-on: macos-latest
    # A universal build compiles Bevy TWICE and came in at 84 minutes for
    # v1.2.2 — against this cap, on a smaller tree. One slice halves the Rust
    # work; the cap stays where it is because a cold cache is still the case to
    # survive, and headroom costs nothing when it is not used.
    timeout-minutes: 90
    env:
      # The one place the architecture is decided. build-app.sh already reads
      # LIGHT_TARGET (it is what `npm run app:build:native` sets) and every path
      # below derives from it, so going back to universal-apple-darwin is this
      # line plus the toolchain targets — not five hardcoded paths to miss one of.
      #
      # Apple Silicon only, deliberately: it halves the build and every tester
      # for this beta is on one. Note what it costs — an arm64 bundle does not
      # run on an Intel Mac at all. Rosetta translates x86_64 to arm64, never
      # the other way.
      LIGHT_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Must match LIGHT_TARGET above. A missing target fails late, after
          # the full test suite has already run.
          targets: aarch64-apple-darwin

      # v2 is deliberate and not stale: its major tag already resolves to a
      # node24 build, unlike checkout/setup-node whose v4 tags stayed on node20.
      - uses: Swatinem/rust-cache@v2

      - name: Set up the signing keychain (also proves the password works)
        # The last release spent 58 minutes running every test and compiling
        # both architecture slices before `security import` rejected the
        # certificate password. That is checkable in seconds, so check it here
        # and fail before anything expensive runs.
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # `secrets` is not an allowed context in a step-level `if:` — using it
          # there is a startup failure that produces a run with no jobs at all.
          # Test the env var inside the shell instead.
          if [ -z "$CERT" ]; then
            echo "no signing certificate configured — skipping"
            exit 0
          fi
          # This keychain STAYS for the build. Tauri imports the certificate
          # into a keychain of its own and signs happily, but scripts/build-app.sh
          # re-signs afterwards (grafting the previz binary breaks the bundle
          # seal) and that codesign call found no identity — Tauri's keychain is
          # not in the search list. Setting one up here, on the search list and
          # unlocked, serves both.
          KC="$RUNNER_TEMP/signing.keychain-db"
          P12="$RUNNER_TEMP/signing.p12"
          printf '%s' "$CERT" | base64 --decode > "$P12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"      # don't auto-lock mid-build
          security unlock-keychain -p ci "$KC"
          # prepend ours, keeping whatever the runner already had — naming
          # login.keychain-db outright fails if the runner has none
          EXISTING=$(security list-keychains -d user | sed 's/[\"]//g' | xargs)
          security list-keychains -d user -s "$KC" $EXISTING
          if ! security import "$P12" -k "$KC" -P "$CERT_PW" -A -T /usr/bin/codesign -T /usr/bin/security >/dev/null 2>&1; then
            echo "::error::APPLE_CERTIFICATE_PASSWORD does not open APPLE_CERTIFICATE."
            echo "Re-run ./scripts/setup-signing-secrets.sh — it now verifies before uploading."
            security delete-keychain "$KC" || true; rm -f "$P12"
            exit 1
          fi
          # without this, codesign blocks on a UI prompt that can never be answered
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          rm -f "$P12"
          echo "identity available to codesign:"
          security find-identity -v -p codesigning | sed 's/[0-9A-F]\{40\}/<hash>/'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Engine smoke tests
        run: npm test

      - name: Rust core tests
        run: cargo test -p light-core

      - name: Differential parity (Node vs Rust)
        run: cargo build -p light-core && npm run test:parity

      - name: App shell tests (licence + updater)
        # ui/dist first: tauri.conf.json declares it a bundle resource, so
        # tauri-build refuses to run the build script without it — and the
        # build script is what stamps LIGHT_VERSION. Nothing has produced it at
        # this point in a clean checkout; locally it is always just sitting
        # there from the last build, which is exactly why this only failed in
        # CI. `npm run app:build` below regenerates it anyway, and a vite build
        # is seconds.
        #
        # Not in ci.yml: that runs on ubuntu-latest and a Tauri app needs
        # webkit2gtk to compile there. macOS is the only platform this app is
        # built for anyway.
        #
        # After parity, not before: parity is the check the two-engine design
        # rests on, and a failure here used to skip it entirely.
        run: |
          npm run build
          cargo test -p light-app
          # These tests compile the whole app in DEBUG, several GB, on top of a
          # release build that has already compiled Bevy. The release bundle
          # lives under target/$LIGHT_TARGET, so this is safe to drop — and the
          # dmg step later needs room to copy an 80 MB bundle and compress it.
          rm -rf target/debug
          df -h /

      - name: Build the app (signed + notarised when secrets exist)
        # With no secrets set these are empty and the bundler falls back to the
        # ad-hoc signature — same output as before. Add a Developer ID cert and
        # an app-specific password as repo secrets and the SAME build starts
        # producing a notarised app that opens on a double-click, with no other
        # change to this workflow.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # App Store Connect API key — preferred over the Apple ID pair when
          # set. The .p8 arrives base64 in a secret and is written to a file
          # below, because notarytool takes a path, not the key material.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "${{ secrets.APPLE_API_KEY }}" ]; then
            mkdir -p "$RUNNER_TEMP/notary"
            printf '%s' "${{ secrets.APPLE_API_KEY }}" | base64 --decode > "$RUNNER_TEMP/notary/key.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary/key.p8"
          fi
          # A Developer ID provisioning profile (base64) lets the bundle carry
          # the keychain access group, which is what keeps the keychain prompt
          # from returning after every update. Optional: without it the build
          # is the same as before, on the login keychain. See
          # docs/distribution.md, "The app's own keychain items".
          if [ -n "${{ secrets.APPLE_PROVISIONING_PROFILE }}" ]; then
            printf '%s' "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 --decode > "$RUNNER_TEMP/light.provisionprofile"
            export LIGHT_PROVISIONING_PROFILE="$RUNNER_TEMP/light.provisionprofile"
          fi
          npm run app:build
          rm -rf "$RUNNER_TEMP/notary" "$RUNNER_TEMP/light.provisionprofile"

      - name: Report how the bundle was signed
        run: |
          codesign -dv --verbose=2 "target/$LIGHT_TARGET/release/bundle/macos/LIGHT.app" 2>&1 | \
            grep -E 'Authority|TeamIdentifier|Signature|flags' || true
          echo "--- keychain access group (needs the provisioning profile secret) ---"
          if codesign -d --entitlements - --xml "target/$LIGHT_TARGET/release/bundle/macos/LIGHT.app" 2>/dev/null | grep -q keychain-access-groups; then
            echo "granted — the data protection keychain is in use"
          else
            echo "absent — the login keychain is in use (the keychain prompt can return after an update)"
          fi
          echo "--- notarisation ticket (absent on ad-hoc builds) ---"
          if xcrun stapler validate "target/$LIGHT_TARGET/release/bundle/macos/LIGHT.app"; then
            echo "stapled"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            # Fatal on a tag, and this is why: LIGHT.zip below is the payload
            # the in-app updater offers, and every installed copy verifies the
            # Apple anchor before swapping. An unstapled release does not
            # inconvenience one downloader — it publishes an update nobody can
            # take, which is an update channel that dies silently.
            echo "::error::not stapled — refusing to publish a release no installed copy could update to"
            exit 1
          else
            echo "not stapled — first launch needs the Privacy & Security > Open Anyway step"
          fi

      - name: Zip the bundle (ditto preserves signatures)
        run: ditto -c -k --keepParent "target/$LIGHT_TARGET/release/bundle/macos/LIGHT.app" LIGHT.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: LIGHT-macos
          path: LIGHT.zip

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Publish release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # A tag with a hyphen is a prerelease by semver's own rule
          # (v1.3.0-beta.1), and GitHub then keeps it off /releases/latest — so
          # the landing page's one-click link cannot start handing a beta to
          # people who wanted the shipping build.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            LIGHT.zip
            target/${{ env.LIGHT_TARGET }}/release/bundle/macos/LIGHT-*.dmg
            target/${{ env.LIGHT_TARGET }}/release/bundle/macos/LIGHT.dmg
          generate_release_notes: true
          body: |
            **LIGHT for macOS** — Apple Silicon, signed with a Developer ID
            and notarised by Apple. This build does **not** run on an Intel Mac.

            Open the .dmg, drag LIGHT to Applications, double-click it. macOS
            confirms once that it came from the internet; there is no
            Privacy & Security step and nothing to allow.

            First launch asks for local network access — Art-Net and sACN need
            it, so LIGHT cannot reach a rig without it.
