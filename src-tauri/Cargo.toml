[package]
name = "light-app"
version = "0.1.0"
edition = "2021"
description = "LIGHT — look engine for Resolume"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs reads the version out of tauri.conf.json so there is one source of
# truth; already in the lock as a normal dependency, so nothing new is fetched.
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
light-core = { path = "../core" }

# GDTF Share lives HERE, not in light-core. The crate that drives DMX has no
# business carrying a TLS stack — reqwest was already in the tree via Tauri but
# with no TLS backend at all, so this is where that arrives. rustls rather than
# native-tls: no OpenSSL to find, nothing new to sign in the bundle.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "json", "form"] }
# the Share session is a PHPSESSID cookie with a 2-hour idle timeout
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Secrets go to the macOS Keychain (src/keychain.rs). Never to the project
# file: the whole project is broadcast to every connected client, including a
# LAN tablet. `keyring` is the legacy login-keychain path — what shipped before
# and what a dev build still uses; `security-framework` (already in the tree
# under keyring and reqwest) is the data protection keychain the signed app
# uses. OSX_10_15 unlocks that keychain's flag; nothing is downloaded.
keyring = { version = "3", features = ["apple-native"] }

# Licence verification. All three are already in Cargo.lock and the local
# registry cache — ring rides in with the TLS stack — so this adds no new
# third-party crypto to a console that drives a rig, which was the condition in
# docs/licensing-integration.md for doing it at all.
# the daily check-in timer; already in the lock under Tauri's async runtime
tokio = { version = "1", features = ["time"] }
ring = "0.17"
base64 = "0.21"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }

[[bin]]
name = "light-app"
path = "src/main.rs"
