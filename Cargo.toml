[workspace]
resolver = "2"
members = ["core", "src-tauri", "previz"]

[profile.release]
lto = true
codegen-units = 1

# Fast iteration on the previz: full optimisation for dependencies (Bevy is
# unusable in debug), debug build for our own code.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
