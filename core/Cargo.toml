[package]
name = "light-core"
version = "0.1.0"
edition = "2021"
description = "LIGHT engine core — DMX look engine with Art-Net/sACN out, OSC/MIDI in, WS control"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"
midir = "0.10"
dirs = "5"
getrandom = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"

[[bin]]
name = "light-engine"
path = "src/bin/light-engine.rs"
