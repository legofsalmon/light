[package]
name = "light-core"
version = "0.1.0"
edition = "2021"
description = "LIGHT engine core — DMX look engine with Art-Net/sACN out, OSC/MIDI in, WS control"

[features]
# "engine" pulls in everything OS-bound (sockets, MIDI, filesystem). Disable
# default features for wasm builds: profiles/GDTF/colour stay available.
default = ["engine"]
engine = ["dep:tungstenite", "dep:midir", "dep:dirs", "dep:getrandom", "dep:rusty_link"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: serde_json's default float parse is best-effort and lands
# 1 ulp off V8's correctly-rounded JSON.parse on ~10 % of 17-digit decimals —
# the exact shortest-round-trip forms JSON.stringify writes into project files.
# Geometry consumes fixture pos/rotY now, so both engines must parse the same
# bytes to the same f64 or world positions diverge at quantization boundaries.
serde_json = { version = "1", features = ["float_roundtrip"] }
tungstenite = { version = "0.24", optional = true }
midir = { version = "0.10", optional = true }
dirs = { version = "5", optional = true }
getrandom = { version = "0.2", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
rusty_link = { version = "0.4.9", optional = true }

[[bin]]
name = "light-engine"
path = "src/bin/light-engine.rs"
required-features = ["engine"]

[[bin]]
name = "light-bench"
path = "src/bin/light-bench.rs"
required-features = ["engine"]
